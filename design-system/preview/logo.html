<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;margin:0}
  .logo-card{display:flex;flex-direction:column;gap:18px}
  .logo-row{display:flex;align-items:center;gap:32px;padding:20px 24px}
  .logo-row + .logo-row{border-top:1px solid #E5E7EB}
  .logo-row.dark{background:#020617;color:#F1F5F9}
  .meta{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#6B7280;line-height:1.7;letter-spacing:0.01em}
  .meta.dark{color:#94A3B8}
  .meta b{display:block;font-weight:700;text-transform:uppercase;letter-spacing:0.18em;font-size:10px;color:#9CA3AF;margin-bottom:6px}
  .meta.dark b{color:#64748B}
  .mono-strong{color:#F97316;font-weight:600}
</style>
</head>
<body>
<div class="card" style="padding:0;width:700px;gap:0">
  <div class="logo-row">
    <svg width="220" height="56" viewBox="0 0 320 80" aria-label="TİRİDY">
      <text x="0" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">T</text>
      <circle cx="56" cy="14" r="3.6" fill="#F97316"/>
      <text x="48" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">İ</text>
      <text x="80" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">R</text>
      <text x="124" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">I</text>
      <text x="146" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">D</text>
      <text x="194" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">Y</text>
    </svg>
    <div class="meta">
      <b>Primary wordmark</b>
      Geist · 900 · −0.04em<br>
      <span class="mono-strong">#F97316</span> orange-500<br>
      Min width 88px · Preserve İ
    </div>
  </div>

  <div class="logo-row dark">
    <svg width="220" height="56" viewBox="0 0 320 80" aria-label="TİRİDY">
      <text x="0" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">T</text>
      <circle cx="56" cy="14" r="3.6" fill="#F97316"/>
      <text x="48" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">İ</text>
      <text x="80" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">R</text>
      <text x="124" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">I</text>
      <text x="146" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">D</text>
      <text x="194" y="62" font-family="Geist, Inter, system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#F97316">Y</text>
    </svg>
    <div class="meta dark">
      <b>On dark surface</b>
      slate-950 background<br>
      Wordmark unchanged · no glow<br>
      Used: marketing nav, footer
    </div>
  </div>

  <div class="logo-row" style="background:#F9FAFB">
    <div style="display:flex;align-items:center;gap:16px">
      <div style="width:56px;height:56px;background:#F97316;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -2px rgba(249,115,22,0.4)">
        <span style="font-family:Geist,sans-serif;font-weight:900;font-size:30px;color:#fff;letter-spacing:-0.02em">T</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <svg width="120" height="32" viewBox="0 0 320 80"><text x="0" y="62" font-family="Geist,sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#0F172A">T</text><circle cx="56" cy="14" r="3.6" fill="#0F172A"/><text x="48" y="62" font-family="Geist,sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#0F172A">İ</text><text x="80" y="62" font-family="Geist,sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#0F172A">R</text><text x="124" y="62" font-family="Geist,sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#0F172A">I</text><text x="146" y="62" font-family="Geist,sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#0F172A">D</text><text x="194" y="62" font-family="Geist,sans-serif" font-weight="900" font-size="62" letter-spacing="-2.4" fill="#0F172A">Y</text></svg>
      </div>
    </div>
    <div class="meta" style="margin-left:auto">
      <b>App icon · monochrome</b>
      Square mark · radius 14px<br>
      Mono variant: slate-900 on light
    </div>
  </div>
</div>
</body></html>
