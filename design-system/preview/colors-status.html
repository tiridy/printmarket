<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="grid-6" style="gap:8px">

    <div style="display:flex;flex-direction:column;gap:4px"><div style="background:#DBEAFE;color:#1D4ED8;padding:6px 10px;border-radius:9999px;font-size:11px;font-weight:600;text-align:center">Onaylandı</div><span class="label-mono" style="text-align:center">info</span></div>

    <div style="display:flex;flex-direction:column;gap:4px"><div style="background:#FEE2E2;color:#B91C1C;padding:6px 10px;border-radius:9999px;font-size:11px;font-weight:600;text-align:center">İptal</div><span class="label-mono" style="text-align:center">error</span></div>
  </div>
  <div class="label" style="font-size:12px">bg-{color}-100 · text-{color}-700 · rounded-full pill</div>
</div></body></html>
