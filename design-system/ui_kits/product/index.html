<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>TİRİDY — Product Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html,body{margin:0;padding:0;background:#F9FAFB;font-family:Geist,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}
    button:hover{filter:brightness(0.97)}
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="AppShell.jsx"></script>
  <script type="text/babel" src="DashboardScreen.jsx"></script>
  <script type="text/babel" src="ExploreScreen.jsx"></script>
  <script type="text/babel" src="OrderStep1.jsx"></script>
  <script type="text/babel" src="ChatScreen.jsx"></script>
  <script type="text/babel">
    function App(){
      const [active, setActive] = React.useState('home');
      let screen;
      if (active==='home')    screen = <DashboardScreen setActive={setActive}/>;
      else if (active==='explore') screen = <ExploreScreen/>;
      else if (active==='order')   screen = <OrderStep1/>;
      else if (active==='chat')    screen = <ChatScreen/>;
      else screen = <DashboardScreen setActive={setActive}/>;
      return <AppShell active={active} setActive={setActive}>{screen}</AppShell>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
